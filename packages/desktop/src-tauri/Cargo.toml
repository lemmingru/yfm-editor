[package]
name = "yfm-editor"
version = "0.5.0"
description = "Native YFM markdown editor"
authors = ["Alexey Melekhin"]
license = "MIT"
repository = "https://github.com/alxmelekhin/yfm-editor"
edition = "2021"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["protocol-asset"] }
tauri-plugin-log = "2.10.1"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-window-state = "2.5.0"
notify-debouncer-full = { version = "0.6.0", features = ["crossbeam-channel"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSString"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.5.4"
